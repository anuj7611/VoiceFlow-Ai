appId: com.voiceflow.ai
productName: VoiceFlow AI

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!server/.env'
  - '!.env'

asar: true

asarUnpack:
  - '**/*.node'
  - node_modules/uiohook-napi/**/*

extraResources:
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: VoiceFlow AI
  artifactName: VoiceFlow-AI-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VoiceFlow AI
  uninstallDisplayName: VoiceFlow AI
  deleteAppDataOnUninstall: false

npmRebuild: false
